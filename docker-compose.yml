version: '3.8'

services:
  # -----------------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: movie-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: discord_movie_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discord_movie_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # Redis Cache & Rate Limiting
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: movie-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # Discord Movie Bot
  # -----------------------------------------------------------------
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-discord-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_DEFAULT_REGION=${TMDB_DEFAULT_REGION:-ID}
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/discord_movie_bot?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEFAULT_LOCALE=${DEFAULT_LOCALE:-id}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}

volumes:
  postgres_data:
  redis_data:
